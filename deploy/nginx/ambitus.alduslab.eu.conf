# nginx-serverblok voor Ambitus (nginx draait op de server zelf).
#
# De SNI-router op :443 (stream.d/) stuurt het verkeer met het PROXY-protocol naar
# 127.0.0.1:8444, waar nginx luistert en het TLS-certificaat heeft. nginx stuurt het
# daarna door naar de app op 127.0.0.1:8006.
#
# Installeren (eerst het certificaat, anders faalt `nginx -t`):
#   sudo certbot certonly --nginx -d ambitus.alduslab.eu
#   sudo cp deploy/nginx/ambitus.alduslab.eu.conf /etc/nginx/sites-available/ambitus
#   sudo ln -s /etc/nginx/sites-available/ambitus /etc/nginx/sites-enabled/ambitus
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name ambitus.alduslab.eu;

    ssl_certificate     /etc/letsencrypt/live/ambitus.alduslab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambitus.alduslab.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Geen zoekmachines: de app werkt op uitnodiging.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Een AI-verzoek kan ruim een minuut duren.
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name ambitus.alduslab.eu;
    return 301 https://$host$request_uri;
}
